<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e1a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="AeroBridge — سجل النمو: سجل تدريب شخصي على نظام أماديوس." />
    <title>AeroBridge — سجل النمو</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/shell.css" />
    <link rel="stylesheet" href="assets/css/growth-record.css" />
  </head>
  <body>
    <!-- ============ HEADER (shared shell — identical markup on every page) ============ -->
    <header class="app-header">
      <a class="brand" href="index.html" aria-label="AeroBridge — Home">
        <span class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <defs>
              <linearGradient id="ab-mark" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#7FA0FF" />
                <stop offset="1" stop-color="#4F7BF5" />
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="28" height="28" rx="9" fill="url(#ab-mark)" />
            <path d="M9 21 16 9 23 21" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M11.9 16.6 20.1 16.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" />
          </svg>
        </span>
        <span class="brand__word"><span class="w-aero">Aero</span><span class="w-bridge">Bridge</span></span>
      </a>

      <div class="header__controls">
        <div class="seg" role="group" aria-label="Language / اللغة">
          <button class="seg__btn" id="lang-ar" type="button" aria-pressed="true">ع</button>
          <button class="seg__btn" id="lang-en" type="button" aria-pressed="false">EN</button>
        </div>

        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark and light theme" title="Toggle theme">
          <svg class="icon ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg>
          <svg class="icon ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>

        <button class="avatar" type="button" aria-label="Your profile" title="نورة الشهري">
          <span aria-hidden="true">NS</span>
        </button>
      </div>
    </header>

    <!-- ============ Page ============ -->
    <main class="page">
      <div class="page__head">
        <h1 class="page__title" id="page-title">سجل النمو</h1>
        <p class="page__sub" id="page-sub">سجل تدريب شخصي — تتبّع صادق للتقدّم عبر المسارين.</p>
      </div>

      <!-- Tabs + standalone Backup -->
      <div class="tabs-row">
        <div class="tabs" role="tablist" aria-label="Growth Record sections">
          <button class="tab" role="tab" data-tab="record" aria-selected="true" aria-controls="panel-record">السجل</button>
          <button class="tab" role="tab" data-tab="history" aria-selected="false" aria-controls="panel-history">التاريخ</button>
          <button class="tab" role="tab" data-tab="reports" aria-selected="false" aria-controls="panel-reports">التقارير</button>
        </div>

        <button class="backup-btn" id="backup-btn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3 5 6v5c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6l-7-3Z" />
            <path d="m9 12 2 2 4-4" />
          </svg>
          <span id="backup-label">نسخة احتياطية</span>
        </button>
      </div>

      <!-- Panels -->
      <section class="panel" id="panel-record" role="tabpanel" aria-label="Record"></section>
      <section class="panel" id="panel-history" role="tabpanel" aria-label="History" hidden></section>
      <section class="panel" id="panel-reports" role="tabpanel" aria-label="Reports" hidden></section>
    </main>

    <!-- ============ BOTTOM NAV (shared shell — identical markup on every page) ============ -->
    <nav class="bottom-nav" aria-label="Primary">
      <a class="nav-item" id="nav-link-progression" href="index.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18" /><path d="m7 15 4-4 3 3 5-6" /></svg>
        <span id="nav-progression">التقدّم</span>
      </a>
      <a class="nav-item" id="nav-link-practice" href="practice.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 17 6-6-6-6" /><path d="M12 19h8" /></svg>
        <span id="nav-practice">التدريب</span>
      </a>
      <a class="nav-item" id="nav-link-growth" href="growth-record.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" /><path d="M14 3v6h6M9 13h6M9 17h4" /></svg>
        <span id="nav-growth">سجل النمو</span>
      </a>
    </nav>

    <!-- ============ Backup dialog ============ -->
    <dialog class="modal" id="backup-dialog" aria-labelledby="bk-title">
      <div class="modal__card">
        <div class="modal__head">
          <h3 id="bk-title">نسخة احتياطية للبيانات</h3>
          <button class="icon-btn" id="bk-close" type="button" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24" stroke-width="1.8"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </div>
        <div class="modal__body">
          <p id="bk-desc">احفظ سجلّك الكامل كملف JSON خام أو استوردهُ.</p>
          <div class="modal__actions">
            <button class="btn btn--primary" id="bk-export" type="button">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /></svg>
              <span>تصدير JSON</span>
            </button>
            <button class="btn btn--ghost" id="bk-import" type="button">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 15V3" /><path d="m7 8 5-5 5 5" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /></svg>
              <span>استيراد JSON</span>
            </button>
          </div>
          <p class="modal__hint" id="bk-hint">JSON خام — يعمل بلا خادم، لحماية بياناتك المحلية.</p>
          <input type="file" id="bk-file" accept="application/json,.json" hidden />
        </div>
      </div>
    </dialog>

    <script src="assets/js/shell.js"></script>
    <script src="assets/js/growth-record.js"></script>
  </body>
</html>
