<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AeroBridge — Header + Bottom Nav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== DESIGN_SYSTEM.md tokens — dark is the source of truth, light is a derived assumption (flagged for approval) ===== */
  :root {
    --bg-primary: #0D1B2A;
    --bg-secondary: #1B263B;
    --card-surface: #131A26;
    --accent: #2563EB;
    --success: #10B981;
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --border: #1E293B;
    --error: #EF4444;
    --warning: #F59E0B;

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
    --radius-card: 8px;
    --radius-btn: 6px;

    --text-xs: 12px; --text-sm: 14px; --text-base: 16px; --text-lg: 18px; --text-xl: 20px;

    --header-h: 60px;
    --nav-h: 64px;
  }

  html[data-theme="light"] {
    --bg-primary: #F8FAFC;
    --bg-secondary: #FFFFFF;
    --card-surface: #F1F5F9;
    --text-primary: #0D1B2A;
    --text-secondary: #64748B;
    --border: #E2E8F0;
    /* accent / success / error / warning stay identical across themes — brand colors, not surface colors */
  }

  * { box-sizing: border-box; }
  html[lang="ar"] body { font-family: 'Alexandria', sans-serif; }
  html[lang="en"] body { font-family: 'Manrope', sans-serif; }

  body {
    margin: 0;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    transition: background .2s ease, color .2s ease;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; cursor: pointer; }

  /* language visibility per UI_GUIDELINES §5 — Arabic for user-facing dialogue */
  html[lang="ar"] .en { display: none; }
  html[lang="en"] .ar { display: none; }

  /* ============ PREVIEW HARNESS (not part of the shipped component) ============ */
  .preview-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--sp-2) var(--sp-4);
    background: repeating-linear-gradient(135deg, var(--card-surface), var(--card-surface) 6px, var(--bg-primary) 6px, var(--bg-primary) 12px);
    border-bottom: 1px dashed var(--border);
    font-size: var(--text-xs);
    color: var(--text-secondary);
  }
  .preview-bar strong { color: var(--text-primary); font-weight: 600; }
  .preview-btn {
    background: var(--card-surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 6px 12px;
    border-radius: var(--radius-btn);
    font-size: var(--text-xs);
    font-weight: 600;
  }
  .preview-btn:hover { border-color: var(--accent); }

  /* ============ REAL COMPONENT: HEADER — UI_GUIDELINES.md §1 ============ */
  .app-header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    height: var(--header-h);
    padding-inline: var(--sp-4);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
  }

  /* Start: logo — first in DOM, so logical props place it at inline-start automatically (right in RTL, left in LTR) */
  .logo {
    display: flex; align-items: center; gap: var(--sp-2);
    text-decoration: none; color: var(--text-primary);
    background: none; border: none; padding: 0;
  }
  .logo-mark { width: 24px; height: 24px; flex-shrink: 0; }
  .logo-word {
    font-weight: 700; font-size: var(--text-lg);
    letter-spacing: 0.02em;
    font-family: 'Manrope', sans-serif; /* brand wordmark stays Latin in both languages, like the project's own docs */
  }

  /* End: cluster — Toggle (closest to center) → Bell → Avatar (closest to edge) */
  .header-cluster { display: flex; align-items: center; gap: var(--sp-3); }

  .icon-btn {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border-radius: 50%; /* icon-only controls: circular by convention, distinct from the 6px token used for text buttons */
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-primary);
  }
  .icon-btn:hover { background: var(--card-surface); border-color: var(--border); }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .badge {
    position: absolute; top: 2px; inset-inline-end: 2px;
    min-width: 15px; height: 15px; padding: 0 3px;
    border-radius: 999px;
    background: var(--error);
    color: #fff;
    font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg-secondary);
  }

  .avatar-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; border: none; background: none; padding: 0; }
  .avatar-circle {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--card-surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
  }
  .avatar-circle svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .status-dot {
    position: absolute; bottom: 0; inset-inline-end: 0;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--success);
    border: 2px solid var(--bg-secondary);
  }

  /* ============ CONTENT PLACEHOLDER (out of scope — shown only so scroll/sticky behavior is testable) ============ */
  .content-area { padding: var(--sp-5) var(--sp-4); padding-bottom: calc(var(--nav-h) + var(--sp-6)); }
  .placeholder-note {
    font-size: var(--text-sm); color: var(--text-secondary);
    text-align: center; padding: var(--sp-5) 0; line-height: 1.7;
  }
  .placeholder-block {
    background: var(--card-surface); border: 1px solid var(--border);
    border-radius: var(--radius-card);
    height: 90px; margin-bottom: var(--sp-4);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); font-size: var(--text-xs);
  }

  /* ============ REAL COMPONENT: BOTTOM NAV — UI_GUIDELINES.md §1 (5 sections) ============ */
  .bottom-nav {
    position: fixed; bottom: 0; inset-inline: 0; z-index: 50;
    display: flex;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px;
    height: var(--nav-h);
    background: none; border: none;
    color: var(--text-secondary);
  }
  .nav-item svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s ease; }
  .nav-item span { font-size: 11px; font-weight: 500; }
  .nav-item.active { color: var(--accent); }
  .nav-item.active span { font-weight: 700; }

  /* accessibility: visible keyboard focus (frontend-design quality floor) */
  .icon-btn:focus-visible, .avatar-btn:focus-visible, .nav-item:focus-visible, .preview-btn:focus-visible, .logo:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

  <!-- ============ PREVIEW HARNESS — demo controls only, NOT part of the shipped Header/Nav ============ -->
  <div class="preview-bar">
    <span><strong class="ar">أدوات معاينة</strong><strong class="en">Preview tools</strong> — <span class="ar">مش جزء من الكومبوننت</span><span class="en">not part of the component</span></span>
    <button class="preview-btn" id="langToggle">AR ⇄ EN</button>
  </div>

  <!-- ============ REAL COMPONENT: HEADER ============ -->
  <header class="app-header">
    <a href="#" class="logo" aria-label="AeroBridge">
      <svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3.5L20.5 19.5H3.5L12 3.5Z" fill="#2563EB" stroke="none"/>
      </svg>
      <span class="logo-word">AeroBridge</span>
    </a>

    <div class="header-cluster">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle dark / light mode">
        <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/>
        </svg>
      </button>

      <button class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.5 9.5a5.5 5.5 0 0 1 11 0c0 4 1.5 5.5 1.5 5.5H5s1.5-1.5 1.5-5.5Z"/>
          <path d="M10 18a2 2 0 0 0 4 0"/>
        </svg>
        <span class="badge">3</span>
      </button>

      <button class="avatar-btn" aria-label="Profile">
        <div class="avatar-circle">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8.5" r="3.5"/>
            <path d="M5 19.5c1.4-4 4-5.8 7-5.8s5.6 1.8 7 5.8"/>
          </svg>
        </div>
        <span class="status-dot"></span>
      </button>
    </div>
  </header>

  <!-- content placeholder: exists only to make scroll + sticky/fixed behavior testable on a real phone -->
  <main class="content-area">
    <p class="placeholder-note">
      <span class="ar">منطقة المحتوى بتختلف حسب كل شاشة — الهيدر والنافيجيشن بس اللي ثابتين هنا للعرض.</span>
      <span class="en">Content area varies per screen — only the header and bottom nav are the fixed component shown here.</span>
    </p>
    <div class="placeholder-block"></div>
    <div class="placeholder-block"></div>
    <div class="placeholder-block"></div>
    <div class="placeholder-block"></div>
    <div class="placeholder-block"></div>
    <div class="placeholder-block"></div>
  </main>

  <!-- ============ REAL COMPONENT: BOTTOM NAV ============ -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 11.5L12 4l8 7.5"/>
        <path d="M6 10.5V19a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-8.5"/>
      </svg>
      <span class="ar">الرئيسية</span><span class="en">Home</span>
    </button>

    <button class="nav-item" data-tab="roadmap">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 19c3-1 3-4.5 6-4.5s3 4.5 6 4.5 3-6 6-6"/>
        <circle cx="4" cy="19" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="20" cy="13" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
      <span class="ar">خارطة الطريق</span><span class="en">Roadmap</span>
    </button>

    <button class="nav-item" data-tab="work">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="4.5" width="17" height="15" rx="2"/>
        <path d="M7 10l3 2.5-3 2.5"/>
        <line x1="12" y1="15" x2="16" y2="15"/>
      </svg>
      <span class="ar">التدريب</span><span class="en">Work</span>
    </button>

    <button class="nav-item" data-tab="coach">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 5.5h16v10.5H9l-4 3.5v-3.5H4V5.5Z"/>
      </svg>
      <span class="ar">المدرّب</span><span class="en">Coach</span>
    </button>

    <button class="nav-item" data-tab="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5"/>
        <path d="M5 20c1.4-4 4-5.5 7-5.5s5.6 1.5 7 5.5"/>
      </svg>
      <span class="ar">الملف الشخصي</span><span class="en">Profile</span>
    </button>
  </nav>

<script>
  // Language toggle — demonstrates the RTL/LTR logical-property mirroring (UI_GUIDELINES.md §1)
  const html = document.documentElement;
  document.getElementById('langToggle').addEventListener('click', () => {
    if (html.lang === 'ar') { html.lang = 'en'; html.dir = 'ltr'; }
    else { html.lang = 'ar'; html.dir = 'rtl'; }
  });

  // Dark/Light toggle — the real header control (UI_GUIDELINES.md §1)
  const themeIconSun = '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/>';
  const themeIconMoon = '<path d="M20 14.2A8.5 8.5 0 1 1 9.8 4a7 7 0 0 0 10.2 10.2Z"/>';
  document.getElementById('themeToggle').addEventListener('click', () => {
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeIcon').innerHTML = isDark ? themeIconMoon : themeIconSun;
  });

  // Bottom nav active state
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
</script>
</body>
</html>
