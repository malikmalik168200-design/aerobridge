<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0E1A" />
  <meta name="description" content="AeroBridge — your Amadeus GDS training progression. Pick up where you left off and advance through the Technical and Customer Service tracks." />
  <title>AeroBridge — التقدّم</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/shell.css" />
  <link rel="stylesheet" href="assets/css/progression.css" />
</head>
<body>
  <!-- ============ HEADER (shared shell — identical markup on every page) ============ -->
  <header class="app-header">
    <a class="brand" href="index.html" aria-label="AeroBridge — Home">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <defs>
            <linearGradient id="ab-mark" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#7FA0FF" />
              <stop offset="1" stop-color="#4F7BF5" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="28" height="28" rx="9" fill="url(#ab-mark)" />
          <path d="M9 21 16 9 23 21" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M11.9 16.6 20.1 16.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" />
        </svg>
      </span>
      <span class="brand__word"><span class="w-aero">Aero</span><span class="w-bridge">Bridge</span></span>
    </a>

    <div class="header__controls">
      <div class="seg" role="group" aria-label="Language / اللغة">
        <button class="seg__btn" id="lang-ar" type="button" aria-pressed="true">ع</button>
        <button class="seg__btn" id="lang-en" type="button" aria-pressed="false">EN</button>
      </div>

      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark and light theme" title="Toggle theme">
        <svg class="icon ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg>
        <svg class="icon ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>

      <button class="avatar" type="button" aria-label="Your profile">
        <span aria-hidden="true">NS</span>
      </button>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="app-main" id="main">
    <h1 class="sr-only" data-i18n="page.heading">Progression</h1>

    <!-- Continue where you left off -->
    <section class="continue" aria-labelledby="continue-heading">
      <div class="continue-top">
        <p class="eyebrow" id="continue-heading" data-i18n="continue.eyebrow">Continue where you left off</p>
        <span class="pill-badge pill-badge--accent" data-i18n="track.technical">Technical Track</span>
      </div>

      <div class="continue-body">
        <div class="ring" role="img" aria-label="68 percent complete">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-track" cx="60" cy="60" r="52" />
            <circle class="ring-fill" id="continueRing" cx="60" cy="60" r="52" transform="rotate(-90 60 60)" />
          </svg>
          <span class="ring-value"><span id="continueRingValue">0</span><span class="ring-pct">%</span></span>
        </div>

        <div class="continue-info">
          <p class="continue-label" data-i18n="continue.level">Level 3 · Basic</p>
          <p class="continue-title" data-i18n="level.pricing.name">Pricing &amp; Ticketing</p>
          <p class="continue-sub" data-i18n="continue.sub">6 of 9 command sets practiced</p>
        </div>
      </div>

      <button class="btn-continue" type="button" id="continueBtn">
        <span data-i18n="action.continue">Continue</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
      </button>
    </section>

    <!-- Track switcher -->
    <section class="tracks" aria-labelledby="tracks-heading">
      <h2 class="section-title" id="tracks-heading" data-i18n="tracks.heading">Choose your track</h2>
      <div class="track-switch" role="tablist" aria-label="Training tracks">
        <span class="track-switch-thumb" aria-hidden="true"></span>
        <button class="track-tab is-active" id="tab-technical" role="tab" aria-selected="true" aria-controls="panel-technical" type="button" data-track="technical">
          <span data-i18n="track.technical">Technical Track</span>
        </button>
        <button class="track-tab" id="tab-service" role="tab" aria-selected="false" aria-controls="panel-service" type="button" data-track="service">
          <span data-i18n="track.service">Customer Service Track</span>
        </button>
      </div>
      <p class="track-desc" id="trackDesc" data-i18n="track.technical.desc">Core Amadeus GDS commands, from Basic fundamentals to Advanced workflows.</p>
    </section>

    <!-- Level lists -->
    <section class="levels" aria-labelledby="levels-heading">
      <h2 class="sr-only" id="levels-heading">Levels</h2>

      <!-- TECHNICAL -->
      <ul class="level-list" id="panel-technical" role="tabpanel" aria-labelledby="tab-technical">
        <li>
          <button class="level level--mastered" type="button" data-progress="100">
            <span class="level-index" aria-hidden="true">01</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.signin.name">Sign-in &amp; Encode/Decode</span>
              <span class="level-meta" data-i18n="status.mastered">Mastered</span>
            </span>
            <span class="level-status" data-status="mastered" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7" /></svg>
            </span>
          </button>
        </li>
        <li>
          <button class="level level--mastered" type="button" data-progress="100">
            <span class="level-index" aria-hidden="true">02</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.availability.name">Availability &amp; Sell</span>
              <span class="level-meta" data-i18n="status.mastered">Mastered</span>
            </span>
            <span class="level-status" data-status="mastered" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7" /></svg>
            </span>
          </button>
        </li>
        <li>
          <button class="level level--active" type="button" data-progress="68" aria-current="step">
            <span class="level-index" aria-hidden="true">03</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.pricing.name">Pricing &amp; Ticketing</span>
              <span class="level-progress">
                <span class="level-bar"><span class="level-bar-fill" data-fill="68"></span></span>
                <span class="level-pct"><span class="pct-num" data-count="68">0</span>%</span>
              </span>
            </span>
            <span class="level-status" data-status="active" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24" stroke-width="2.4"><path d="m9 6 6 6-6 6" /></svg>
            </span>
          </button>
        </li>
        <li>
          <button class="level level--available" type="button" data-progress="0">
            <span class="level-index" aria-hidden="true">04</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.pnr.name">PNR Creation</span>
              <span class="level-meta" data-i18n="status.available">Ready to start</span>
            </span>
            <span class="level-status" data-status="available" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24" stroke-width="2.4"><path d="m9 6 6 6-6 6" /></svg>
            </span>
          </button>
        </li>
        <li>
          <button class="level level--locked" type="button" data-progress="0" aria-disabled="true">
            <span class="level-index" aria-hidden="true">05</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.ancillaries.name">Ancillaries, Seats &amp; Special Services</span>
              <span class="level-meta" data-i18n="status.locked">Locked</span>
            </span>
            <span class="level-status" data-status="locked" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
            </span>
          </button>
        </li>
        <li>
          <button class="level level--locked" type="button" data-progress="0" aria-disabled="true">
            <span class="level-index" aria-hidden="true">06</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.queues.name">Queues &amp; PNR Management</span>
              <span class="level-meta" data-i18n="status.locked">Locked</span>
            </span>
            <span class="level-status" data-status="locked" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
            </span>
          </button>
        </li>
        <li>
          <button class="level level--locked" type="button" data-progress="0" aria-disabled="true">
            <span class="level-index" aria-hidden="true">07</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.fares.name">Advanced Fares &amp; Reissue</span>
              <span class="level-meta" data-i18n="status.locked">Locked · Advanced</span>
            </span>
            <span class="level-status" data-status="locked" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
            </span>
          </button>
        </li>
        <li>
          <button class="level level--locked" type="button" data-progress="0" aria-disabled="true">
            <span class="level-index" aria-hidden="true">08</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.interline.name">Interline &amp; Group Bookings</span>
              <span class="level-meta" data-i18n="status.locked">Locked · Advanced</span>
            </span>
            <span class="level-status" data-status="locked" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
            </span>
          </button>
        </li>
      </ul>

      <!-- CUSTOMER SERVICE -->
      <ul class="level-list is-hidden" id="panel-service" role="tabpanel" aria-labelledby="tab-service" hidden>
        <li>
          <button class="level level--mastered" type="button" data-progress="100">
            <span class="level-index" aria-hidden="true">01</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.greeting.name">Greeting &amp; Rapport</span>
              <span class="level-meta" data-i18n="status.mastered">Mastered</span>
            </span>
            <span class="level-status" data-status="mastered" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7" /></svg>
            </span>
          </button>
        </li>
        <li>
          <button class="level level--active" type="button" data-progress="34">
            <span class="level-index" aria-hidden="true">02</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.disruption.name">Handling Flight Disruptions</span>
              <span class="level-progress">
                <span class="level-bar"><span class="level-bar-fill" data-fill="34"></span></span>
                <span class="level-pct"><span class="pct-num" data-count="34">0</span>%</span>
              </span>
            </span>
            <span class="level-status" data-status="active" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24" stroke-width="2.4"><path d="m9 6 6 6-6 6" /></svg>
            </span>
          </button>
        </li>
        <li>
          <button class="level level--available" type="button" data-progress="0">
            <span class="level-index" aria-hidden="true">03</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.complaints.name">De-escalating Complaints</span>
              <span class="level-meta" data-i18n="status.available">Ready to start</span>
            </span>
            <span class="level-status" data-status="available" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24" stroke-width="2.4"><path d="m9 6 6 6-6 6" /></svg>
            </span>
          </button>
        </li>
        <li>
          <button class="level level--locked" type="button" data-progress="0" aria-disabled="true">
            <span class="level-index" aria-hidden="true">04</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.upsell.name">Upselling with Empathy</span>
              <span class="level-meta" data-i18n="status.locked">Locked</span>
            </span>
            <span class="level-status" data-status="locked" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
            </span>
          </button>
        </li>
        <li>
          <button class="level level--locked" type="button" data-progress="0" aria-disabled="true">
            <span class="level-index" aria-hidden="true">05</span>
            <span class="level-main">
              <span class="level-name" data-i18n="level.vip.name">VIP &amp; Special Assistance</span>
              <span class="level-meta" data-i18n="status.locked">Locked</span>
            </span>
            <span class="level-status" data-status="locked" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
            </span>
          </button>
        </li>
      </ul>
    </section>
  </main>

  <!-- ============ BOTTOM NAV (shared shell — identical markup on every page) ============ -->
  <nav class="bottom-nav" aria-label="Primary">
    <a class="nav-item" id="nav-link-progression" href="index.html">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18" /><path d="m7 15 4-4 3 3 5-6" /></svg>
      <span id="nav-progression">Progression</span>
    </a>
    <a class="nav-item" id="nav-link-practice" href="practice.html">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 17 6-6-6-6" /><path d="M12 19h8" /></svg>
      <span id="nav-practice">Practice</span>
    </a>
    <a class="nav-item" id="nav-link-growth" href="growth-record.html">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" /><path d="M14 3v6h6M9 13h6M9 17h4" /></svg>
      <span id="nav-growth">Growth Record</span>
    </a>
  </nav>

  <script src="assets/js/shell.js"></script>
  <script src="assets/js/progression.js"></script>
</body>
</html>
